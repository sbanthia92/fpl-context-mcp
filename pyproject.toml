[project]
name = "fpl-context-mcp"
version = "0.5.0"
description = "MCP server that gives Claude Fantasy Premier League stats and press/injury news search, with ingestion jobs that keep PostgreSQL and Pinecone up to date."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shubham Banthia", email = "sbanthia92@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "fantasy-premier-league", "fpl", "sports", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # MCP server framework (stdio transport). Pinned below 2.0 — server.py uses
    # the mcp 1.x low-level Server decorator API (@server.list_tools() etc.),
    # which mcp 2.x removed/rewrote entirely.
    "mcp>=1.0.0,<2.0.0",
    # Pinecone vector store — used by the MCP tool and the press ingestion job
    "pinecone>=5.0.0",
    # Async PostgreSQL client — used by the MCP query tool (server is async)
    "asyncpg>=0.29.0",
    # Sync PostgreSQL client — used by the threaded ingest_match_data job
    "psycopg2-binary>=2.9.9",
    # Sync HTTP client — used by both threaded ingestion jobs
    "requests>=2.32.0",
    # .env file support for local development
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/sbanthia92/fpl-context-mcp"
Repository = "https://github.com/sbanthia92/fpl-context-mcp"
Changelog = "https://github.com/sbanthia92/fpl-context-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sbanthia92/fpl-context-mcp/issues"

[project.scripts]
fpl-context-mcp = "server:main"
fpl-context-ingest-press = "jobs.ingest_press_content:main"
fpl-context-ingest-match = "jobs.ingest_match_data:main"
fpl-context-backfill-history = "jobs.backfill_history:main"

# Run the MCP server: cd fpl-context-mcp && python server.py
# (stdio transport — register in claude_desktop_config.json or via mcp install)

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*", "jobs*"]

[tool.setuptools]
py-modules = ["config", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
