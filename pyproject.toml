[project]
name = "fpl-context-mcp"
version = "0.11.0"
description = "MCP server that gives any AI agent live Fantasy Premier League data (gameweek, fixtures, players, match history, manager squads, injuries) straight from the FPL API, with zero setup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Shubham Banthia", email = "sbanthia92@gmail.com" },
]
keywords = ["mcp", "model-context-protocol", "fantasy-premier-league", "fpl", "sports", "football", "soccer", "chatgpt", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # MCP server framework (stdio + streamable HTTP transports; streamable HTTP
    # needs >=1.8, and uvicorn/starlette come with it). Pinned below 2.0 — server.py uses
    # the mcp 1.x low-level Server decorator API (@server.list_tools() etc.),
    # which mcp 2.x removed/rewrote entirely.
    "mcp>=1.8.0,<2.0.0",
    # Sync HTTP client — the FPL API client (run in worker threads) and the canary script
    "requests>=2.32.0",
    # .env file support for local development
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/sbanthia92/fpl-context-mcp"
Repository = "https://github.com/sbanthia92/fpl-context-mcp"
Changelog = "https://github.com/sbanthia92/fpl-context-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/sbanthia92/fpl-context-mcp/issues"

[project.scripts]
fpl-context-mcp = "server:main"

# Run the MCP server: cd fpl-context-mcp && python server.py
# (stdio transport — register in claude_desktop_config.json or via mcp install)

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.setuptools]
py-modules = ["config", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
